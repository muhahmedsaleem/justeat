name: Auto Apply Just Eat Pisa

on:
  schedule:
    - cron: '*/15 * * * *'  # Runs every 5 minutes (the fastest GitHub allows)
  workflow_dispatch:

jobs:
  run-apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Playwright
        run: |
          pip install playwright requests
          playwright install chromium --with-deps

      - name: Run Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIRST_NAME: ${{ secrets.FIRST_NAME }}
          LAST_NAME: ${{ secrets.LAST_NAME }}
          EMAIL: ${{ secrets.EMAIL }}
          PHONE: ${{ secrets.PHONE }}
          INVITE_CODE: ${{ secrets.INVITE_CODE }}
        run: python apply_justeat.py